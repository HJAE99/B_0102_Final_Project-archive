# =====================================================================
# SCV 가상 세계 (3-2차) — 가상 로봇 시험 전용 「실제 세계」
#   로봇이 순찰하면서 측정 · 판정으로 알아내야 하는 값만 둡니다. DB에는 넣지 않습니다.
#   가상 로봇(robot*_virtual.py)만 읽고, 관제 PC는 측정 결과(히트맵 · 후보 · 판정)로만 알게 됩니다.
#
#   DB에 등록하는 정보는 여기 두지 않습니다 — server page 정보 탭에서 testbed 지도를 고르고 입력:
#     지도(testbed.yaml · pgm) · 도크 접근 자세(지도 › 수정) · AP SSID · 메모 · 설치 위치 · 점검 설비
#   (README 0장에 testbed 시험용 입력값 표가 있음)
#
#   좌표는 모두 testbed 지도의 map 좌표(m)
# =====================================================================

# AP 신호 — 신호 원점(x, y)과 세기 모델. SSID는 server page에 등록한 SSID와 같아야 측정 대상이 됨  → 3-4차 RSSI
#   rssi = p1m_dbm − 10 · n · log10(원점까지 거리 m) − (음영 구역 안이면 loss_db) + 잡음(σ = noise_db)
#   원점은 「실제로 AP가 있는 곳」 — DB의 설치 위치와 일부러 다르게 두면 등록 위치가 틀린 경우도 시험할 수 있음
ap_models:
  SCV_VAP_A: { x: 2.0, y: 6.5, p1m_dbm: -35, n: 2.5, noise_db: 2.0 }
  SCV_VAP_B: { x: 9.0, y: 3.5, p1m_dbm: -35, n: 2.5, noise_db: 2.0 }

# 음영 구역 — 이 사각형 안에서는 모든 AP 신호가 loss_db만큼 약해짐 (네트워크 후보가 나와야 하는 곳)  → 3-4 · 3-5차
holes:
  - { name: "작은 방(오른쪽 위)", x0: 8.0, y0: 5.1, x1: 12.0, y1: 8.0, loss_db: 20 }

# 설비의 실제 상태 — 설비 ID는 server page에 등록한 testbed 지도의 설비 ID  → 3-6차
#   truth: normal | abnormal | not_detected | occluded | position(실제 위치가 moved_to로 옮겨져 있음)
facilities:
  EXT-01: { truth: normal }
  EXT-02: { truth: abnormal }
  EXT-03: { truth: not_detected }
  SHT-01: { truth: occluded }
  EXL-01: { truth: normal }
  EXL-02: { truth: position, moved_to: { x: 0.15, y: 2.8 } }
