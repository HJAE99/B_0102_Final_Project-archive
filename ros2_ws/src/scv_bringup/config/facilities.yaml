# 설비 등록 (SR-19). 좌표는 저장 지도(map, testbed_v1) 기준 [m], 각도 [rad].
# kind 는 scv_msgs/InspectionResult 의 KIND_* 와 같다.
# 값이 0.0 인 항목은 아직 재지 않은 것이다 — 비전 팀이 시험하면서 채우고 고친다.
# 좌표 재는 법: RViz 에서 지도를 띄우고 「Publish Point」 로 찍은 뒤 `ros2 topic echo /clicked_point` 의 x·y 를 적는다.
#   expected = 설비가 있는 위치 · view = 로봇이 서서 볼 자세 (yaw 는 로봇이 바라보는 방향, +x 가 0, 반시계가 +)
# view 는 벽·장애물에서 0.45 m 이상 띄운다 (Nav2 inflation_radius 0.45, 로봇 반경 약 0.19 m). 더 붙이면 도착이 불안정하다.
facilities:
  # 방화셔터 하강 띠 (10/12 PM 이 잼). 띠 위도 주행·측정 구역이다. 띠 위에 물체가 있으면 이상.
  # 띠가 3 m 를 넘어 양 끝에서 한 번씩 본다 (같은 band, 관측 자세만 다름). 섹터 1(아래) 로봇이 맡는다.
  - id: SHT-01
    kind: shutter             # =2 · 방화셔터 하강구간
    band: [[3.154, 3.279], [0.059, 3.299], [0.059, 2.685], [3.181, 2.718]]   # 하강 띠의 네 꼭짓점
    view: {x: 2.70, y: 3.00, yaw: 3.142}   # 오른쪽 끝에서 왼쪽(-x)을 봄. 오른쪽 벽(x 3.18)에서 0.48 m. depth 는 0.7 m 부터라 x 2.0 이하를 본다
  - id: SHT-02
    kind: shutter
    band: [[3.154, 3.279], [0.059, 3.299], [0.059, 2.685], [3.181, 2.718]]
    view: {x: 0.55, y: 3.00, yaw: 0.0}     # 왼쪽 끝에서 오른쪽(+x)을 봄. 왼쪽 벽(x 0.08)에서 0.47 m. x 1.25 이상을 본다 (두 자리를 합쳐 띠 전체)
  - id: EXT-01
    kind: extinguisher        # =1 · 소화기 (유무·위치·압력계)
    expected: {x: 0.0, y: 0.0}          # 설비가 있어야 할 위치
    view: {x: 0.0, y: 0.0, yaw: 0.0}    # 설비에서 1.0–1.2 m, depth 는 약 0.7 m 부터 유효
  - id: EXL-01
    kind: exit_light          # =3 · 비상구 유도등
    expected: {x: 0.0, y: 0.0}
    view: {x: 0.0, y: 0.0, yaw: 0.0}
  - id: RCK-01
    kind: rack                # =4 · 랙 적재물 돌출
    expected: {x: 0.0, y: 0.0}          # 랙의 위치
    view: {x: 0.0, y: 0.0, yaw: 0.0}    # 랙을 측면에서 보는 자세
