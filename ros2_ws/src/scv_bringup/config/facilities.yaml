# 설비 등록 (SR-19). 좌표는 저장 지도(map, testbed_v1) 기준 [m], 각도 [rad].
# kind 는 scv_msgs/InspectionResult 의 KIND_* 와 같다.
# 값이 0.0 인 항목은 아직 재지 않은 것이다.
# 10/15 19:30 실측 (「구조물 검출 위치」, 로봇이 검출한 자세 · 쿼터니언 → yaw = 2·atan2(qz, qw)). 설비 자체 위치는 재지 않아 expected 는 관측 자세로 대신한다.
# 점검은 view 가 들어 있는 섹터(zones.yaml)를 맡은 로봇이 한다: y < 3.29 는 robot4(Z1), 그 위는 robot3(Z2).
# 좌표 재는 법: RViz 에서 지도를 띄우고 「Publish Point」 로 찍은 뒤 `ros2 topic echo /clicked_point` 의 x·y 를 적는다.
#   expected = 설비가 있는 위치 · view = 로봇이 서서 볼 자세 (yaw 는 로봇이 바라보는 방향, +x 가 0, 반시계가 +)
# view 는 벽·장애물에서 0.45 m 이상 띄운다 (Nav2 inflation_radius 0.45, 로봇 반경 약 0.19 m). 더 붙이면 도착이 불안정하다.
facilities:
  # ---- 섹터 Z1 (robot4) ----
  # 방화셔터 하강 띠 (10/12 PM 이 잼). 띠 위도 주행·측정 구역이다. 띠 위에 물체가 있으면 이상.
  - id: SHT-01
    kind: shutter             # =2 · 방화셔터 하강구간
    band: [[3.154, 3.279], [0.059, 3.299], [0.059, 2.685], [3.181, 2.718]]   # 하강 띠의 네 꼭짓점
    expected: {x: 2.577, y: 2.915}
    view: {x: 2.577, y: 2.915, yaw: -3.1187}   # 10/15 실측 (q z -0.99993 w 0.01144, -178.7°) — 오른쪽 끝에서 왼쪽(-x)을 봄
  # SHT-02 (띠 왼쪽 끝 0.55, 3.00 에서 +x) 는 10/15 실측 목록에 없어 뺀다. 다시 넣으려면 view {x: 0.55, y: 3.00, yaw: 0.0}
  - id: RCK-01
    kind: rack                # =4 · 랙 적재물 돌출
    expected: {x: 1.834, y: 0.338}
    view: {x: 1.834, y: 0.338, yaw: 3.0664}    # 렉0 (q z 0.99929 w 0.03757, +175.7°). 아래 벽(y -0.05)에서 0.39 m
  - id: EXT-01
    kind: extinguisher        # =1 · 소화기 (유무·위치·압력계)
    expected: {x: 0.676, y: 1.362}
    view: {x: 0.676, y: 1.362, yaw: 2.6923}    # 소화기0 (q z 0.97487 w 0.22278, +154.3°)
  - id: EXL-01
    kind: exit_light          # =3 · 비상구 유도등
    expected: {x: 0.932, y: 0.925}
    view: {x: 0.932, y: 0.925, yaw: -3.0596}   # 비상구0 (q z -0.99916 w 0.04100, -175.3°)
  # ---- 섹터 Z2 (robot3) ----
  - id: EXT-02
    kind: extinguisher
    expected: {x: 0.549, y: 4.233}
    view: {x: 0.549, y: 4.233, yaw: 2.2709}    # 소화기1 (q z 0.90673 w 0.42172, +130.1°)
  - id: EXT-03
    kind: extinguisher
    expected: {x: 2.566, y: 5.868}
    view: {x: 2.566, y: 5.868, yaw: 0.6451}    # 소화기2 (q z 0.31699 w 0.94843, +37.0°)
  - id: RCK-02
    kind: rack
    expected: {x: 1.775, y: 6.086}
    view: {x: 1.775, y: 6.086, yaw: 3.0881}    # 렉1 (q z 0.99964 w 0.02675, +176.9°). 위 벽(y 6.48)에서 0.39 m
  - id: EXL-02
    kind: exit_light
    expected: {x: 2.165, y: 4.345}
    view: {x: 2.165, y: 4.345, yaw: -1.5457}   # 비상구1 (q z -0.69816 w 0.71594, -88.6°)
