# 측정 구역 (SR-05). 좌표는 저장 지도(map, testbed_v1) 기준 [m].
# 섹터는 2개이고 로봇 하나가 섹터 하나를 맡는다 (10/12). 바깥 경계는 벽이다 (지도에서 읽은 벽 안쪽: x 0.08–3.18, y -0.05–6.48).
# 경로 점은 벽·장애물에서 0.45 m 이상 띄운다 (Nav2 inflation_radius). dock 은 Dock 의 위치이고 주행 목표가 아니다.
# 경계는 셔터 하강 띠의 위쪽 끝(y 3.29)이다 — 띠는 섹터 1 에 들어간다.
zones:
  - id: Z1                    # 아래 섹터 · 셔터 띠 포함
    robot: robot4             # 로봇 A
    dock: {x: 3.184, y: 0.995}
    polygon: [[0.08, -0.05], [3.18, -0.05], [3.18, 3.29], [0.08, 3.29]]   # 꼭짓점 (반시계 방향)
    spacing: 1.0              # 왕복 경로 간격 [m] (제안 1.0, RSSI 실측을 보고 조정)
  - id: Z2                    # 위 섹터
    robot: robot3             # 로봇 B
    dock: {x: 3.176, y: 4.597}
    polygon: [[0.08, 3.29], [3.18, 3.29], [3.18, 6.48], [0.08, 6.48]]
    spacing: 1.0
