# =====================================================================
# SCV 실시간 저장소 (2차) — 관제 PC의 robotdb4_redis 컨테이너 전용
#   키 8개: robot:{rid}:state(TTL 30 s) · robot:{rid}:path · robot:{rid}:estop ·
#           run:current · run:{run}:progress · live:{run}:cells · stream:events · session:{token}
#   영구 기록은 PostgreSQL이 맡고, Redis는 화면 갱신용 최신값·이벤트 흐름만 둠
# =====================================================================

bind 0.0.0.0
port 6379
protected-mode yes

# --- 계정 (ACL) ------------------------------------------------------
# 기본 사용자는 끄고 rokey만 허용. 비밀번호는 운영 전에 바꿀 것
user default off
user rokey on >rokey ~* &* +@all

# --- 영속성: 재시작해도 세션·진행률·이벤트 흐름이 남도록 ---------------
appendonly yes
appendfsync everysec
dir /data

# --- 메모리 ---------------------------------------------------------
# TTL이 있는 키(로봇 상태·세션)부터 비움. stream:events는 api가 MAXLEN으로 길이 제한
maxmemory 256mb
maxmemory-policy volatile-lru

# --- 키 만료 알림 ----------------------------------------------------
# robot:{rid}:state가 30 s 동안 갱신되지 않아 만료되면 api가 __keyevent@0__:expired로 받아 E3 기록
notify-keyspace-events Ex
